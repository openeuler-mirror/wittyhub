storage:
  type: "local"
  local_path: "/opt/wittyhub"

model:
  name: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: ""
  timeout: 30

crawler:
  github_token: ""

security:
  # Skillspector (Jenkins-based scanner) — sensitive fields via env vars
  enable_audit: true
  skillspector_jenkins_url: ""  # 通过环境变量 SKILLSPECTOR_JENKINS_URL 配置
  skillspector_jenkins_user: ""
  skillspector_jenkins_token: ""

postgres:
  host: "localhost"
  port: 5432
  user: "wittyhub"
  password: "wittyhub_secret"
  db: "wittyhub"
  sslmode: "disable"

ai:
  embedding_model: "BAAI/bge-base-zh-v1.5"
  embedding_host: "http://localhost:8082"
  embedding_dimension: 768
  enable_semantic_search: true

app:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "*"

logging:
  level: "INFO"
  format: "json"
