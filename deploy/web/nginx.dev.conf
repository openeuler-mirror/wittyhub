limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
limit_req_zone $binary_remote_addr zone=per_ip_api_requests:10m rate=30r/s;

server {
    listen 8080;
    server_name localhost;
    charset utf-8;
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_conn per_ip_connections 20;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    if ($request_method ~ "^(TRACE|OPTIONS)$") {
        return 405;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=per_ip_api_requests burst=60 nodelay;

        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
    }

    location ~ ^/(?:\.git|\.svn|\.hg)(?:/|$) {
        deny all;
    }

    location ~ ^/\.env(?:\.|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
