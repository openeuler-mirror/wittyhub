# 1. 配置优先级（从低到高）：代码默认值 < 本文件 < SECTION__FIELD 环境变量。
# 2. Docker 部署时，deploy/.env 由 Compose 读取；
# 只有 compose.yaml 显式映射的变量才会进入容器并覆盖本文件，
# 例如 POSTGRES__PASSWORD -> postgres.password。
# 3. 本地直接运行 Python 时不会自动读取 deploy/.env，此时默认使用本文件。

storage:
  type: "local"
  local_path: "/opt/wittyhub"

model:
  name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key: ""
  timeout: 30

crawler:
  github_token: ""
  gitcode_token: ""

security:
  # Skillspector (Jenkins-based scanner) — sensitive fields via env vars
  enable_audit: true
  skillspector_jenkins_url: "http://localhost:8083"
  skillspector_jenkins_user: "admin"
  skillspector_jenkins_token: ""

postgres:
  host: "localhost"
  port: 5432
  user: "wittyhub"
  password: ""
  db: "wittyhub"
  sslmode: "disable"

ai:
  embedding_model: "BAAI/bge-base-zh-v1.5"
  embedding_host: "http://localhost:8082"
  embedding_dimension: 768
  enable_semantic_search: true

app:
  host: "0.0.0.0"
  port: 8080
  cors_origins:
    - "*"

logging:
  level: "INFO"
  format: "json"
